# Assigns an issue to the Copilot cloud agent when a trigger label is added.
# See: https://docs.github.com/en/enterprise-cloud@latest/copilot/how-tos/use-copilot-agents/cloud-agent/start-copilot-sessions
name: Assign to Copilot

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  assign:
    if: github.event.label.name == 'spec-approved'
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue to Copilot
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPO}/issues/${ISSUE_NUMBER}/assignees" \
            --input - <<EOF
          {
            "assignees": ["copilot-swe-agent[bot]"],
            "agent_assignment": {
              "target_repo": "${REPO}",
              "base_branch": "main"
            }
          }
          EOF
